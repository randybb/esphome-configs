script:
  # counts as activity: wakes the dimmed screen and restarts the idle timeout back to the home page
  - id: wake_screen
    then:
      - lambda: |-
          lv_display_trigger_activity(nullptr);
          if (id(dimmed)) {
            id(dimmed) = false;
            id(panel).request_brightness(${brightness});
          }
  # like the info popup of the other panels: device info is on the status page
  # notification over every page (top layer); closes on tap or after the timeout
  - id: notify_show
    mode: restart
    parameters:
      heading: string
      message: string
      timeout_ms: int
    then:
      - lambda: |-
          lv_label_set_text(id(notify_heading), heading.c_str());
          lv_label_set_text(id(notify_message), message.c_str());
          lv_obj_set_hidden(id(notify_popup), false);
      - script.execute: wake_screen
      - delay: !lambda 'return timeout_ms > 0 ? timeout_ms : 10000;'
      - lvgl.widget.hide: notify_popup
  - id: info_popup
    then:
      - lvgl.page.show: page_7
      - script.execute: wake_screen
  # same as the status screens of the other LVGL devices (mcu-lvgl.yaml)
  - id: update_status
    then:
      - lambda: |-
          // ok green, waiting orange, details gray
          static const uint32_t OK = 0x4DD966, WAIT = 0xFFB300;
          auto set = [](lv_obj_t *label, const std::string &text, uint32_t color) {
            lv_label_set_text(label, text.c_str());
            lv_obj_set_style_text_color(label, lv_color_hex(color), LV_PART_MAIN);
          };

          auto *wifi = wifi::global_wifi_component;
          const bool wifi_ok = wifi->is_connected();
          // diagnostics for slow connects after a cold start: seconds to connect, AP association
          static uint32_t connected_s = 0;
          if (wifi_ok && !connected_s)
            connected_s = std::max<uint32_t>(1, millis() / 1000);
          if (wifi_ok) {
            set(id(status_wifi), str_sprintf("WiFi: pripojené za %u s  (%d dBm)", connected_s, wifi->wifi_rssi()), OK);
          } else {
            auto bssid = wifi->wifi_bssid();
            bool associated = std::any_of(bssid.begin(), bssid.end(), [](uint8_t b) { return b != 0; });
            set(id(status_wifi),
                str_sprintf("WiFi: pripájam...  %s, %us", associated ? "AP ok, čakám na IP" : "bez AP", millis() / 1000),
                WAIT);
          }

          // IPv6 first (skip link-local), then IPv4
          std::string ips;
          char buf[network::IP_ADDRESS_BUFFER_SIZE];
          for (bool v6 : {true, false}) {
            for (auto &ip : wifi->get_ip_addresses()) {
              if (!ip.is_set() || ip.is_ip6() != v6)
                continue;
              ip.str_to(buf);
              if (v6 && strncmp(buf, "fe80", 4) == 0)
                continue;
              if (!ips.empty())
                ips += "\n";
              ips += buf;
            }
          }
          lv_label_set_text(id(status_ips), ips.c_str());
          lv_obj_set_hidden(id(status_ips), ips.empty());

          const bool api_ok = api::global_api_server->is_connected(true);
          set(id(status_ha), api_ok ? "Home Assistant: pripojený" : "Home Assistant: čakám...", api_ok ? OK : WAIT);

          const uint32_t up = millis() / 1000;
          static char build[Application::BUILD_TIME_STR_SIZE] = "";
          if (!build[0])
            App.get_build_time_string(build);
          lv_label_set_text(id(status_footer),
                            str_sprintf("ESPHome %s  ·  beží %ud %02u:%02u:%02u\n%s", ESPHOME_VERSION, up / 86400,
                                        (up / 3600) % 24, (up / 60) % 60, up % 60, build).c_str());
  - id: open_light
    parameters:
      entity: string
      name: string
      dim: bool
      kmin: int
      hs: bool
      is_on: bool
      bri: float
      ct: float
      hue: string
    then:
      - lambda: |-
          id(cur_light) = entity;
          id(back_page) = id(lvgl_main)->get_current_page();
          lv_label_set_text(id(detail_title), name.c_str());
          lv_obj_set_state(id(detail_power), LV_STATE_CHECKED, is_on);
          lv_obj_set_hidden(id(detail_bri_row), !dim);
          // colour lights get hue only: brightness plus either colour temperature or hue
          lv_obj_set_hidden(id(detail_ct_row), !kmin || hs);
          lv_obj_set_hidden(id(detail_hue_row), !hs);
          lv_slider_set_value(id(detail_bri), brightness_pct(bri), LV_ANIM_OFF);
          if (kmin) {
            lv_slider_set_range(id(detail_ct), kmin, 6500);
            lv_slider_set_value(id(detail_ct), std::isnan(ct) ? kmin : ct, LV_ANIM_OFF);
          }
          lv_slider_set_value(id(detail_hue), std::max(0, parse_hue(hue)), LV_ANIM_OFF);
      - lvgl.page.show: page_light
  - id: update_forecast
    then:
      - lambda: |-
          static const char *const DAYS[] = {"ne", "po", "ut", "st", "št", "pi", "so"};
          lv_obj_t *const DAY[] = {id(forecast_day_0), id(forecast_day_1), id(forecast_day_2)};
          lv_obj_t *const ICON[] = {id(forecast_icon_0), id(forecast_icon_1), id(forecast_icon_2)};
          lv_obj_t *const HIGH[] = {id(today_high), id(forecast_high_0), id(forecast_high_1), id(forecast_high_2)};
          lv_obj_t *const LOW[] = {id(today_low), id(forecast_low_0), id(forecast_low_1), id(forecast_low_2)};
          auto now = id(ha_time).now();
          ForecastDay days[4];
          // index 0 is today
          int n = now.is_valid() ? parse_forecast(id(forecast).state, 0, days, 4) : 0;
          for (int i = 0; i < 4; i++) {
            if (i < n) {
              lv_label_set_text_fmt(HIGH[i], "%.1f°C", days[i].high);
              lv_label_set_text_fmt(LOW[i], "%.1f°C", days[i].low);
            } else {
              lv_label_set_text(HIGH[i], "");
              lv_label_set_text(LOW[i], "");
            }
            if (i == 0) continue;
            lv_label_set_text(DAY[i - 1], i < n ? DAYS[(now.day_of_week + i - 1) % 7] : "");
            lv_label_set_text(ICON[i - 1], i < n ? weather_icon(days[i].condition) : "");
          }
  - id: update_clock
    then:
      - lambda: |-
          static const char *const DAYS[] = {"nedeľa", "pondelok", "utorok", "streda", "štvrtok", "piatok", "sobota"};
          static const char *const MONTHS[] = {"januára", "februára", "marca", "apríla", "mája", "júna",
                                               "júla", "augusta", "septembra", "októbra", "novembra", "decembra"};
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          lv_label_set_text(id(clock_label), now.strftime("%H:%M").c_str());
          lv_label_set_text_fmt(id(date_label), "%s, %u. %s", DAYS[now.day_of_week - 1], now.day_of_month,
                                MONTHS[now.month - 1]);

time:
  - id: !extend ha_time
    on_time_sync:
      - script.execute: update_clock
      - script.execute: update_forecast
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

image:
  - platform: file
    file: assets/images/made-for-esphome-white-on-black.svg
    id: esphome_logo
    resize: 300x88
    type: RGB565
    transparency: alpha_channel

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lvgl.page.is_showing: page_7
          then:
            - script.execute: update_status

lvgl:
  id: lvgl_main
  displays: panel
  # 1/8 screen draw buffer in internal RAM; a full-screen PSRAM buffer renders much slower
  buffer_size: 12.5%
  touchscreens:
    - touchscreen_id: panel_touch
  color_depth: 16
  bg_color: 0x000000
  text_color: 0xFFFFFF
  text_font: font_m
  gradients:
    - id: ct_grad
      direction: HOR
      stops:
        - {color: 0xFF9A3C, position: 0%}
        - {color: 0xFFE4C4, position: 50%}
        - {color: 0xCFDCFF, position: 100%}
    - id: hue_grad
      direction: HOR
      stops:
        - {color: 0xFF0000, position: 0%}
        - {color: 0xFFFF00, position: 17%}
        - {color: 0x00FF00, position: 33%}
        - {color: 0x00FFFF, position: 50%}
        - {color: 0x0000FF, position: 67%}
        - {color: 0xFF00FF, position: 83%}
        - {color: 0xFF0000, position: 100%}
  style_definitions:
    - id: tile_style
      bg_color: 0x1C1C1E
      bg_opa: COVER
      radius: 14
      border_width: 0
      shadow_width: 0
      pad_all: 14
      text_color: 0xFFFFFF
      text_font: font_m
    - id: page_style
      bg_color: 0x000000
      bg_opa: COVER
      text_font: font_m
      text_color: 0xFFFFFF
      border_width: 0
      pad_all: 16
      pad_row: 12
      pad_column: 12
  on_idle:
    timeout: 30s
    then:
      # without Home Assistant the status page stays
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - lvgl.page.show: page_0
      - globals.set:
          id: dimmed
          value: "true"
      - lambda: 'id(panel).request_brightness(id(idle_brightness));'
  top_layer:
    widgets:
      - obj:
          id: notify_popup
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: 70%
          border_width: 0
          radius: 0
          pad_all: 24
          on_click:
            - script.stop: notify_show
            - lvgl.widget.hide: notify_popup
          widgets:
            - obj:
                clickable: false
                width: 100%
                height: 100%
                styles: tile_style
                pad_all: 20
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  pad_row: 12
                widgets:
                  - label:
                      id: notify_heading
                      text: ""
                      text_color: 0xF5B342
                      width: 100%
                      long_mode: WRAP
                  - label:
                      id: notify_message
                      text: ""
                      width: 100%
                      long_mode: WRAP
  # Pages, not a tileview: a tile switch made LVGL render the whole screen three times. No animation,
  # every frame of one would be a full-screen redraw over UART (~290 kB).
  pages:
    - id: page_0
      styles: page_style
      on_click:
        - lvgl.page.show: page_1
      widgets:
        - label:
            id: clock_label
            text: "--:--"
            text_font: font_clock
            align: TOP_LEFT
            x: 4
            y: -10
        - label:
            id: date_label
            text: ""
            text_color: 0xB4B4BA
            align: TOP_LEFT
            x: 10
            y: 118
        - label:
            id: nameday_label
            text: ""
            text_font: font_s
            text_color: 0x8E8E93
            align: TOP_LEFT
            x: 10
            y: 148
        - obj:
            clickable: false
            align: TOP_RIGHT
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: FLEX
              flex_flow: COLUMN
              pad_row: 10
            widgets:
              - <<: !include {file: common/nspanel_terminal/forecast_day.yaml, vars: {i: 0}}
              - <<: !include {file: common/nspanel_terminal/forecast_day.yaml, vars: {i: 1}}
              - <<: !include {file: common/nspanel_terminal/forecast_day.yaml, vars: {i: 2}}
        - obj:
            clickable: false
            align: BOTTOM_LEFT
            x: 8
            y: -22
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            text_color: 0xFFFFFF
            layout:
              type: FLEX
              pad_column: 2
              flex_flow: ROW
              flex_align_cross: START
            widgets:
              - label:
                  id: in_temp_label
                  text: "-"
                  text_font: font_big
                  text_color: 0xFFFFFF
              - label:
