                  text_color: 0xB4B4BA
        - label:
            text: "dnu"
            text_font: font_s
            text_color: 0x8E8E93
            align: BOTTOM_LEFT
            x: 10
        - obj:
            clickable: false
            align: BOTTOM_LEFT
            x: 158
            y: -22
            width: SIZE_CONTENT
