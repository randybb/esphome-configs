switch:
  - platform: gpio
    name: Relay 1
    id: relay_1
    pin:
      number: 22

  - platform: gpio
    name: Relay 2
    id: relay_2
    pin:
      number: 19

  # Turn screen power on/off. Easy way to configure the screen power control, but this should not be used from HA, as all components must be re-initialized afterwards. For lights, names of lights etc. this practically means that the state must change once to happen.
  - platform: gpio
    name: Screen Power
    id: screen_power
    entity_category: config
    pin:
      number: 4
      inverted: true
    restore_mode: ALWAYS_ON

rtttl:
  id: buzzer
  output: buzzer_out

sensor:
  - platform: adc
    id: ntc_source
    pin: 38
    update_interval: 5min
    attenuation: 12db

  - platform: resistance
    id: resistance_sensor
    sensor: ntc_source
    configuration: DOWNSTREAM
    resistor: 11.2kOhm

  - platform: ntc
    id: temperature
    name: Temperature
    sensor: resistance_sensor
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm

  - platform: homeassistant
    id: inside_temperature
    entity_id: sensor.zigbee_office_r_temperature
    internal: true
    on_value:
      - lvgl.label.update:
          id: in_temp_label
          text: !lambda 'return std::isnan(x) ? std::string("--") : str_sprintf("%.1f", x);'

  - platform: homeassistant
    id: outside_temperature
    entity_id: sensor.zigbee_outside_temperature
    internal: true
    on_value:
      - lvgl.label.update:
          id: out_temp_label
          text: !lambda 'return std::isnan(x) ? std::string("--") : str_sprintf("%.1f", x);'

  - platform: template
    id: room_temperature_id

