  l_living_amb: !include {file: common/nspanel_terminal/light_tile.yaml, vars: {page: page_1, id: l_living_amb, name: "(Gauč)", entity: light.living_room_ambilight, icon: "\U000F1051", dim: true, kmin: 1700, hs: true}}
  # page_2 Romanko
  l_office: !include {file: common/nspanel_terminal/light_tile.yaml, vars: {page: page_2, id: l_office, name: "Svetlo", entity: light.mcu_nspanel_office_r_light, icon: "\U000F0769", dim: false, kmin: 0, hs: false}}
  l_strip: !include {file: common/nspanel_terminal/light_tile.yaml, vars: {page: page_2, id: l_strip, name: "LED pásik", entity: light.office_r_desk_strip, icon: "\U000F1051", dim: true, kmin: 1700, hs: true}}
  office_spacer: !include {file: common/nspanel_terminal/spacer_tile.yaml, vars: {page: page_2}}
