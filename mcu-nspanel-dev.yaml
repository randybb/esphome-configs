  s_shed_light: !include {file: common/nspanel_terminal/switch_tile.yaml, vars: {page: page_3, id: s_shed_light, name: "Z. domček", entity: switch.mcu_shed_light, icon: "\U000F091D", domain: switch}}
  s_shed_socket: !include {file: common/nspanel_terminal/switch_tile.yaml, vars: {page: page_3, id: s_shed_socket, name: "Z. domček", entity: switch.mcu_shed_socket, icon: "\U000F1108", domain: switch}}
  s_garden: !include {file: common/nspanel_terminal/switch_tile.yaml, vars: {page: page_3, id: s_garden, name: "Záhrada", entity: switch.mcu_shed_garden_light, icon: "\U000F1987", domain: switch}}
  # page_4 Závlaha, robot -> page_irrigation_auto
  v_a1: !include {file: common/nspanel_terminal/switch_tile.yaml, vars: {page: page_4, id: v_a1, name: "A1", entity: switch.mcu_well_irrigation_valve_a1, icon: "\U000F1066", domain: switch}}
  v_a2: !include {file: common/nspanel_terminal/switch_tile.yaml, vars: {page: page_4, id: v_a2, name: "A2", entity: switch.mcu_well_irrigation_valve_a2, icon: "\U000F1066", domain: switch}}
  v_a3: !include {file: common/nspanel_terminal/switch_tile.yaml, vars: {page: page_4, id: v_a3, name: "A3", entity: switch.mcu_well_irrigation_valve_a3, icon: "\U000F1066", domain: switch}}
  v_a4: !include {file: common/nspanel_terminal/switch_tile.yaml, vars: {page: page_4, id: v_a4, name: "A4", entity: switch.mcu_well_irrigation_valve_a4, icon: "\U000F1066", domain: switch}}
  v_a5: !include {file: common/nspanel_terminal/switch_tile.yaml, vars: {page: page_4, id: v_a5, name: "A5", entity: switch.mcu_well_irrigation_valve_a5, icon: "\U000F1066", domain: switch}}
  irrigation_auto: !include {file: common/nspanel_terminal/nav_tile.yaml, vars: {page: page_4, to: page_irrigation_auto, icon: "\U000F06A9"}}
  ir_morning: !include {file: common/nspanel_terminal/switch_tile.yaml, vars: {page: page_irrigation_auto, id: ir_morning, name: "Ráno", entity: automation.irrigation_morning, icon: "\U000F059C", domain: automation}}
  ir_patio: !include {file: common/nspanel_terminal/switch_tile.yaml, vars: {page: page_irrigation_auto, id: ir_patio, name: "Terasa", entity: automation.irrigation_patio, icon: "\U000F024A", domain: automation}}
  ir_grass: !include {file: common/nspanel_terminal/switch_tile.yaml, vars: {page: page_irrigation_auto, id: ir_grass, name: "Rast trávy", entity: automation.irrigation_grow_grass, icon: "\U000F1510", domain: automation}}
  # page_6 Brána, robot -> page_gate_auto
  gate_open: !include {file: common/nspanel_terminal/action_tile.yaml, vars: {page: page_6, id: gate_open, name: "Otvoriť", icon: "\U000F116A", action: button.press, entity: button.mcu_gate_open}}
  gate_close: !include {file: common/nspanel_terminal/action_tile.yaml, vars: {page: page_6, id: gate_close, name: "Zatvoriť", icon: "\U000F0299", action: button.press, entity: button.mcu_gate_close}}
