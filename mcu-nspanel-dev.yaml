---
# Hardware: Sonoff NSPanel (EU)
# Pinout:
#   GPIO2   IO2
#   GPIO4   Screen power                  -> Screen Power (switch gpio) (inverted)
#   GPIO14  Left button                   -> Left Button (binary_sensor gpio) (inverted)
#   GPIO16  Display UART TX               -> display_uart (uart tx_pin)
#   GPIO17  Display UART RX               -> display_uart (uart rx_pin)
#   GPIO19  Relay 2                       -> Relay 2 (switch gpio)
#   GPIO21  Buzzer                        -> buzzer_out (output ledc)
#   GPIO22  Relay 1                       -> Relay 1 (switch gpio)
#   GPIO23  Relay 3 (no relay, connector)
#   GPIO27  Right button                  -> Right Button (binary_sensor gpio) (inverted)
#   GPIO37  ALS (light sensor)
#   GPIO38  NTC temperature (ADC)         -> ntc_source (sensor adc)
substitutions:
  device: nspanel-dev
  name: NSPanel DEV
  area: DEV
  comment: NSPanel (nspanel-terminal)
  brightness: "80"
  # backlight after 30 s idle, tune to taste
  dim_brightness: "20"

esphome:
  name: mcu-${device}
  friendly_name: ${name}
  area: ${area}
  comment: ${comment}
  includes:
    - common/nspanel_terminal/weather.h
    - common/nspanel_terminal/ha.h
    - common/nspanel_terminal/light.h
    - common/nspanel_terminal/thermostat.h
  on_boot:
    - priority: -100
      then:
        - lvgl.page.show: page_7

esp32:
  variant: esp32
  toolchain: esp-idf
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic
      minimum_chip_revision: 3.0
      sram1_as_iram: true
    sdkconfig_options:
      # NSPanel PSRAM on non-default pins
      CONFIG_D0WD_PSRAM_CLK_IO: "5"
      CONFIG_D0WD_PSRAM_CS_IO: "18"

psram:
  mode: quad
  speed: 40MHz
  ignore_not_found: false

external_components:
  # fork with the fixes of ptaru/nspanel-terminal#1 (TFT upload, faster redraws); upstream once merged
  - source: github://randybb/nspanel-terminal@upload-and-redraw-fixes
    components: [nspanel_terminal]

packages:
  common: !include common/common.yaml
  ipv6_only: !include common/ipv6_only.yaml
  sleep_dim: !include
    file: common/nspanel_terminal/sleep_dim.yaml
    vars:
      sleep_override_entity: light.mcu_nspanel_office_r_light
  # Grid page tiles: each package adds its tile to the page and fills it in this order
  # page_1 Kuchyňa / Obývačka
  l_kitchen: !include {file: common/nspanel_terminal/light_tile.yaml, vars: {page: page_1, id: l_kitchen, name: "Kuchyňa", entity: light.kitchen, icon: "\U000F0769", dim: true, kmin: 2700, hs: false}}
  l_dining: !include {file: common/nspanel_terminal/light_tile.yaml, vars: {page: page_1, id: l_dining, name: "Stôl", entity: light.dining_table, icon: "\U000F1793", dim: true, kmin: 2700, hs: false}}
  l_living: !include {file: common/nspanel_terminal/light_tile.yaml, vars: {page: page_1, id: l_living, name: "Gauč", entity: light.living_room, icon: "\U000F04B9", dim: true, kmin: 2700, hs: false}}
  l_tv: !include {file: common/nspanel_terminal/light_tile.yaml, vars: {page: page_1, id: l_tv, name: "TV", entity: light.mcu_tv_light_light, icon: "\U000F0502", dim: false, kmin: 0, hs: false}}
