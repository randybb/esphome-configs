---
# Hardware: M5Stack M5Stamp C3
# Pinout:
#   GPIO0   I2C SDA
#   GPIO1   I2C SCL
#   GPIO2   NEO
#   GPIO3   BUTTON
#   GPIO4                              -> led_red (output ledc)
#   GPIO5                              -> led_green (output ledc)
#   GPIO6                              -> led_blue (output ledc)
#   GPIO20  UART RX
#   GPIO21  UART TX
substitutions:
  device: office-r
  name: Office R
  area: Office R
  comment: MS Teams presence

esphome:
  name: mcu-${device}
  friendly_name: ${name}
  area: ${area}
  comment: ${comment}
  platformio_options:
    board_build.flash_mode: dio


esp32:
  variant: esp32c3
  toolchain: esp-idf
  framework:
    advanced:
      flash_chip: generic
    type: esp-idf

packages:
  common: !include common/common.yaml
  ipv6_only: !include common/ipv6_only.yaml

light:
  - platform: rgb
    name: "MS Teams Presence Light"
    red: led_red
    green: led_green
    blue: led_blue
    effects:
      - pulse:
      - pulse:
          name: "Fast Pulse"
          transition_length: 1s
          update_interval: 1s
      - pulse:
          name: "Slow Pulse"
          transition_length: 2s      # defaults to 1s
          update_interval: 2s

output:
  - platform: ledc
    id: led_red
    pin: 4
  - platform: ledc
    id: led_green
    pin: 5
  - platform: ledc
    id: led_blue
    pin: 6
