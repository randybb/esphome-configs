---
# Hardware: LilyGO T-PCIE with SIM7600 module
# Pinout:
#   GPIO4   Modem PWRKEY               -> modem_powerkey (switch gpio)
#   GPIO12  LED                        -> led (switch gpio) (inverted)
#   GPIO21                             -> system_i2c (i2c sda)
#   GPIO22                             -> system_i2c (i2c scl)
#   GPIO25  Modem power enable         -> modem_enable (switch gpio)
#   GPIO26  Modem TXD                  -> atmodem (modem rx_pin)
#   GPIO27  Modem RXD                  -> atmodem (modem tx_pin)
#   GPIO32  Modem DTR                  -> modem_dtr (binary_sensor gpio)
#   GPIO33  Modem RI                   -> modem_ri (binary_sensor gpio)
#   GPIO36  Modem STATUS               -> modem_status (binary_sensor gpio)
# I2C:
#   0x34  pmu_axp (axp192), LDO3 powers the GNSS antenna
#   0x3C  OLED (display ssd1306_i2c)
substitutions:
  device: tracker
  name: Tracker
  area: DEV
  comment: LTE GPS tracker
  # 2400 mAh cell, charged only to 4.1 V by the axp192 component, so ~90% of it is usable
  battery_capacity_mah: "2160"
  # O2 Telemetria bills per day, the cheapest tier is up to 0.1 MB: values go out on a real change,
  # otherwise once per report_interval
  report_interval: 1h
  # Parked: GNSS goes off after gnss_parked_min minutes under parked_speed km/h, then wakes every
  # gnss_probe_min minutes for gnss_probe_window_min to check whether the car moved
  parked_speed: "5"
  gnss_parked_min: "10"
  gnss_probe_min: "30"
  gnss_probe_window_min: "3"
  # Without USB: Battery Low at battery_low_percent, power off below battery_off_voltage (V);
  # the AXP itself cuts off at 2.9 V (VOFF)
  battery_low_percent: "20"
  battery_off_voltage: "3.3"
  # The modem reports only DOP; accuracy in m = DOP * this typical range error. Tune against a known spot
  gnss_uere_m: "5"

esphome:
  name: mcu-${device}
  friendly_name: ${name}
  area: ${area}
  comment: ${comment}
  on_boot:
    priority: 600
    then:
      - logger.log: turning modem on
      - switch.turn_on: led
      - switch.turn_on: modem_enable
      - delay: 1s
      - switch.turn_on: modem_powerkey
      - delay: 500ms
      - switch.turn_off: modem_powerkey
      - switch.turn_on: gnss_enable
      - delay: 4s
      - wait_until:
          condition:
            binary_sensor.is_on: modem_status
          timeout: 30s
      - logger.log: modem on
      - modem.enable

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic
      sram1_as_iram: true

# packages:
  # common: !include common/common.yaml # modem only for now, no WiFi
  # ipv6_only: !include common/ipv6_only.yaml

external_components:
  - source: github://m5stack/esphome-yaml
    components: [axp192]
    refresh: 1h

logger:
  level: VERBOSE

i2c:
  - id: system_i2c
    sda: 21
    scl: 22
    scan: true

axp192:
  id: pmu_axp
  address: 0x34
  i2c_id: system_i2c

modem:
  id: atmodem
  rx_pin: 26
  tx_pin: 27
  model: SIM7600
  apn: o2internet
  enable_on_boot: false # on_boot powers the modem up first
  # pin_code: ""
  init_at:
    - AT+CPSI=60        # URC +CPSI every 60 s, for the operator
    - AT+CGNSSINFO=30   # URC +CGNSSINFO every 30 s while GNSS runs; dev has no GNSS sensors
  on_connect:
    # Survives an ESP reboot without a modem power cycle; the modem answers ERROR if GNSS already runs
    - if:
        condition:
          switch.is_on: gnss_switch
        then:
          - modem.send_at: AT+CGPS=1

# API is unreachable over LTE, the tracker has to talk MQTT
mqtt:
  id: mqtt_client
  broker: !secret mqtt_ext
  # Own user, so the broker ACL can limit it to its own topics
  username: !secret mqtt_tracker_username
  password: !secret mqtt_tracker_password
  discovery: true
  # Every message costs data: logs stay on USB, and one ping per 10 min keeps the session.
  # Lower keepalive if O2's CGNAT drops idle TCP sooner (reconnects resend all discovery)
  log_topic: null
  keepalive: 600s
  on_connect:
    # ESPHome has no device_tracker, so the discovery for one is sent here; the identifiers put it on
    # the same device as the other entities, and the position comes from the attributes.
    # on_connect fires before the client counts as connected, and a publish before that is dropped
    - wait_until: mqtt.connected
    - mqtt.publish_json:
        topic: homeassistant/device_tracker/mcu-${device}/location/config
        retain: true
        payload: |-
          root["name"] = "Location";
          root["unique_id"] = "mcu-${device}-location";
          root["source_type"] = "gps";
          root["json_attributes_topic"] = "mcu-${device}/location";
          root["availability_topic"] = "mcu-${device}/status";
          root["device"].to<JsonObject>()["identifiers"].to<JsonArray>().add(get_mac_address());

output:
  # DLDO3 in the m5stack component = AXP192 LDO3
  - platform: axp192
    id: gnss_power
    channel: DLDO3
    voltage: 3300

binary_sensor:
  - <<: !include common/binary_sensor/status.yaml
  - platform: template
    id: battery_low
    name: Battery Low
    device_class: battery
    lambda: return !id(usb_power).state && id(battery).state <= ${battery_low_percent};
    filters:
      - delayed_on: 2min
  # Below battery_off_voltage for 3 min without USB: power off before the cell is deep discharged.
  # The AXP starts again on PWR, or on USB when the board powers on with external power
  - platform: template
    id: battery_empty
    internal: true
    lambda: return !id(usb_power).state && id(battery_voltage).state < ${battery_off_voltage};
    filters:
      - delayed_on: 3min
    on_press:
      - logger.log:
          level: WARN
          format: Battery empty, powering off
      - modem.disable
      - delay: 10s
      # REG 32H bit 7: power off; the component's shutdown() writes the AXP2101 register
      - lambda: id(pmu_axp).writeRegister(0x32, id(pmu_axp).readRegister(0x32) | 0x80);
  - platform: gpio
    id: modem_dtr
    pin: 32
  - platform: gpio
    id: modem_ri
    pin: 33
  - platform: gpio
    id: modem_status
    pin: 36

button:
  - <<: !include common/button/restart.yaml

sensor:
  - <<: !include common/sensor/uptime.yaml
    update_interval: ${report_interval}
  # State of charge from the AXP192 coulomb counter. The counter and the marker live in the AXP, so
  # they survive ESP reboots and are lost together when the battery is pulled; until the next full
  # charge this reports unknown.
  - platform: template
    id: battery_soc
    name: Battery Charge
    internal: true
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      auto *pmu = id(pmu_axp);
      if (pmu->is_failed() || !pmu->isBatteryConnect())
        return NAN;
      int ctl = pmu->readRegister(0xB8);
      if (ctl < 0)
        return NAN;
      if (!(ctl & 0x80))
        pmu->writeRegister(0xB8, 0x80);  // start counting
      if (pmu->readRegister(0x06) != 0xCC)
        return NAN;  // no full charge since the AXP lost power
      int64_t cnt[2] = {0, 0};  // 0xB0 charge, 0xB4 discharge, 32 bit big endian
      for (int c = 0; c < 2; c++) {
        for (int i = 0; i < 4; i++) {
          int b = pmu->readRegister(0xB0 + 4 * c + i);
          if (b < 0)
            return NAN;
          cnt[c] = (cnt[c] << 8) | b;
        }
      }
      // Datasheet: mAh = 65536 * 0.5 mA * (charge - discharge) / 3600 / ADC rate (25 Hz << reg 0x84[7:6])
      float rate = 25 << ((pmu->readRegister(0x84) >> 6) & 3);
      float mah = 32768.0f * (cnt[0] - cnt[1]) / 3600.0f / rate;
      return clamp(100.0f + mah * 100.0f / ${battery_capacity_mah}, 0.0f, 100.0f);
  # The only battery value HA gets: the coulomb counter once calibrated, the voltage estimate until
  # then, in 10 % steps
  - platform: template
    id: battery
    name: Battery
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      return std::isnan(id(battery_soc).state) ? id(battery_level).state : id(battery_soc).state;
    filters:
      - lambda: return roundf(x / 10.0f) * 10.0f;
      - or:
          - heartbeat: ${report_interval}
          - delta: 10
  - platform: axp192
    id: pmu_sensors
    axp192_id: pmu_axp
    update_interval: 60s
    battery_voltage:
      id: battery_voltage
      name: Battery Voltage
      internal: true
    battery_level:
      id: battery_level
      name: Battery Level
      internal: true
    battery_charge_current:
      name: Battery Charge Current
      internal: true
    battery_discharge_current:
      name: Battery Discharge Current
      internal: true
    vbus_voltage:
      name: VBUS Voltage
      internal: true
    internal_temperature:
      name: PMU Temperature
      internal: true
    battery_charging:
      name: Battery Charging
      internal: true
      on_release:
        # Charging ended on USB at full voltage: that is 100%, so restart the coulomb counter here.
        # ponytail: a USB unplug near full also passes the voltage check, a few % off at most
        - lambda: |-
            auto *pmu = id(pmu_axp);
            if (pmu->isVbusIn() && id(battery_voltage).state > 4.05f) {
              pmu->writeRegister(0xB8, 0xA0);  // counter on, clear
              pmu->writeRegister(0x06, 0xCC);  // marker in the AXP data buffer: counter starts at full
            }
    battery_connected:
      name: Battery Connected
      internal: true
    vbus_present:
      id: usb_power
      name: USB Power
    usb_present:
      name: USB Present
      internal: true
  - platform: modem
    rssi:
      id: modem_rssi
      name: Modem Signal
      entity_category: diagnostic
      filters:
        - or:
            - heartbeat: ${report_interval}
            - delta: 6
    ber:
      name: Modem BER
      entity_category: diagnostic
      filters:
        - heartbeat: ${report_interval}
  # Filled from the +CGNSSINFO URC. lat/lon deltas are ~50 m at 48° N
  - platform: template
    id: latitude
    name: Latitude
    internal: true
    update_interval: never
    on_value:
      - script.execute: publish_location
    filters:
      - or:
          - heartbeat: ${report_interval}
          - delta: 0.0005
  - platform: template
    id: longitude
    name: Longitude
    internal: true
    update_interval: never
    on_value:
      - script.execute: publish_location
    filters:
      - or:
          - heartbeat: ${report_interval}
          - delta: 0.0007
  - platform: template
    id: altitude
    name: Altitude
    internal: true
    update_interval: never
  - platform: template
    id: speed
    name: Speed
    internal: true
    update_interval: never
  - platform: template
    id: course
    name: Course
    internal: true
    update_interval: never
  - platform: template
    id: gnss_accuracy
    name: GNSS Accuracy
    internal: true
    update_interval: never
  - platform: template
    id: gnss_vertical_accuracy
    name: GNSS Vertical Accuracy
    internal: true
    update_interval: never

switch:
  - platform: gpio
    id: modem_powerkey
    pin: 4
  - platform: gpio
    id: led
    pin: 12
    inverted: true
  - platform: gpio
    id: modem_enable
    pin: 25
  - platform: output
    id: gnss_enable
    output: gnss_power
  - platform: template
    id: gnss_switch
    name: GNSS
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - modem.send_at: AT+CGPS=1
    turn_off_action:
      - modem.send_at: AT+CGPS=0

text_sensor:
  - <<: !include common/text_sensor/version.yaml
  # Text sensors publish every value, so these copy theirs only when it changes
  - platform: template
    id: modem_operator
    name: Modem Operator
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: modem_network
    name: Modem Network
    entity_category: diagnostic
    update_interval: never
  # The operator comes from the +CPSI URC, the position from +CGNSSINFO; the component has sensors for neither
  - platform: modem
    network_type:
      id: modem_network_raw
      internal: true
      on_value:
        - lambda: |-
            if (id(modem_network).state != x)
              id(modem_network).publish_state(x);
    urc:
      id: modem_urc
      internal: true
      on_value:
        - lambda: |-
            // +CPSI: <system mode>,<operation mode>[,<MCC>-<MNC>,...]
            char op[16];
            if (sscanf(x.c_str(), "+CPSI: %*[^,],%*[^,],%15[^,]", op) == 1) {
              if (id(modem_operator).state != op)
                id(modem_operator).publish_state(op);
              return;
            }
            // +CGNSSINFO: <mode>,<satellite counts>,<ddmm.mmmmmm>,<N/S>,<dddmm.mmmmmm>,<E/W>,<date>,<UTC time>,
            //   <alt m>,<speed kn>,<course>,<PDOP>,<HDOP>,<VDOP>
            // The number of satellite counts differs between firmwares, so the fields are found from N/S.
            // Without a fix all fields are empty
            if (x.rfind("+CGNSSINFO:", 0) != 0)
              return;
            std::vector<std::string> f;
            for (size_t i = x.find(':') + 1, j; ; i = j + 1) {
              j = x.find(',', i);
              f.push_back(x.substr(i, j == std::string::npos ? j : j - i));
              if (j == std::string::npos)
                break;
            }
            size_t ns = 1;
            while (ns < f.size() && f[ns] != "N" && f[ns] != "S")
              ns++;
            if (ns + 10 > f.size()) {
              id(latitude).publish_state(NAN);
              id(longitude).publish_state(NAN);
              id(speed).publish_state(NAN);
              return;
            }
            auto num = [&](size_t i) { return f[i].empty() ? NAN : strtof(f[i].c_str(), nullptr); };
            auto deg = [](double v) { double d = floor(v / 100); return d + (v - d * 100) / 60; };
            double lat = deg(strtod(f[ns - 1].c_str(), nullptr)), lon = deg(strtod(f[ns + 1].c_str(), nullptr));
            id(altitude).publish_state(num(ns + 5));
            id(speed).publish_state(num(ns + 6) * 1.852f);
            id(course).publish_state(num(ns + 7));
            id(gnss_accuracy).publish_state(num(ns + 9) * ${gnss_uere_m});
            id(gnss_vertical_accuracy).publish_state(ns + 10 < f.size() ? num(ns + 10) * ${gnss_uere_m} : NAN);
            id(latitude).publish_state(f[ns] == "S" ? -lat : lat);
            id(longitude).publish_state(f[ns + 2] == "W" ? -lon : lon);

script:
  # Latitude and longitude change in the same poll; one message for both
  - id: publish_location
    mode: restart
    then:
      - delay: 1s
      - if:
          condition:
            lambda: return !std::isnan(id(latitude).state) && !std::isnan(id(longitude).state);
          then:
            - mqtt.publish_json:
                topic: mcu-${device}/location
                retain: true
                payload: |-
                  root["latitude"] = id(latitude).state;
                  root["longitude"] = id(longitude).state;
                  if (!std::isnan(id(altitude).state))
                    root["altitude"] = id(altitude).state;
                  if (!std::isnan(id(speed).state))
                    root["speed"] = id(speed).state;
                  if (!std::isnan(id(course).state))
                    root["course"] = id(course).state;
                  if (!std::isnan(id(gnss_accuracy).state))
                    root["gps_accuracy"] = roundf(id(gnss_accuracy).state);
                  if (!std::isnan(id(gnss_vertical_accuracy).state))
                    root["vertical_accuracy"] = roundf(id(gnss_vertical_accuracy).state);
                  if (!std::isnan(id(battery).state))
                    root["battery_level"] = id(battery).state;

time:
  # Over PPP; one NTP exchange is ~150 B, so a few a day are enough for the ESP's clock
  - platform: sntp
    id: sntp_time
    update_interval: 6h

globals:
  - id: still_minutes
    type: int
    initial_value: "0"
  - id: parked
    type: bool
    initial_value: "false"
  - id: parked_minutes
    type: int
    initial_value: "0"

interval:
  # Saves the GNSS current while parked; the speed comes from GNSS, the board has no accelerometer
  - interval: 60s
    then:
      - lambda: |-
          if (id(parked)) {
            if (++id(parked_minutes) >= ${gnss_probe_min}) {
              // A look around: the logic below keeps GNSS on if the car moves within the window
              id(parked) = false;
              id(still_minutes) = ${gnss_parked_min} - ${gnss_probe_window_min};
              id(gnss_enable).turn_on();
              id(gnss_switch).turn_on();
            }
            return;
          }
          float v = id(speed).state;  // NAN without a fix
          if (!std::isnan(v) && v >= ${parked_speed}) {
            id(still_minutes) = 0;
          } else if (++id(still_minutes) >= ${gnss_parked_min}) {
            id(parked) = true;
            id(parked_minutes) = 0;
            id(gnss_switch).turn_off();
            id(gnss_enable).turn_off();
          }
