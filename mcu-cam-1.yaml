---
# Hardware: ESP32-CAM (AI-Thinker style, runs hot)
# Pinout:
#   GPIO0                              -> Camera (esp32_camera)
#   GPIO5                              -> Camera (esp32_camera data_pins)
#   GPIO18                             -> Camera (esp32_camera data_pins)
#   GPIO19                             -> Camera (esp32_camera data_pins)
#   GPIO21                             -> Camera (esp32_camera data_pins)
#   GPIO22                             -> Camera (esp32_camera pixel_clock_pin)
#   GPIO23                             -> Camera (esp32_camera href_pin)
#   GPIO25                             -> Camera (esp32_camera vsync_pin)
#   GPIO26                             -> i2c_bus (i2c sda)
#   GPIO27                             -> i2c_bus (i2c scl)
#   GPIO32                             -> Enable (switch gpio)
#   GPIO34                             -> Camera (esp32_camera data_pins)
#   GPIO35                             -> Camera (esp32_camera data_pins)
#   GPIO36                             -> Camera (esp32_camera data_pins)
#   GPIO39                             -> Camera (esp32_camera data_pins)
substitutions:
  device: cam-1
  name: Cam 1
  area: DEV
  comment: Camera

esphome:
  name: mcu-${device}
  friendly_name: ${name}
  area: ${area}
  comment: ${comment}

esp32:
  variant: esp32
  toolchain: esp-idf
  framework:
    type: esp-idf

packages:
  common: !include common/common.yaml

i2c:
  id: i2c_bus
  sda: 26
  scl: 27
  scan: true

psram:
  mode: quad
  speed: 40MHz

esp32_camera:
  name: Camera
  external_clock:
    pin: 0
    frequency: 20MHz
  i2c_id: i2c_bus
  data_pins: [5, 18, 19, 21, 36, 39, 34, 35]
  vsync_pin: 25
  href_pin: 23
  pixel_clock_pin: 22
  # power_down_pin: 32

switch:
  - platform: gpio
    pin: 32
    restore_mode: ALWAYS_ON
    # id: "cam_power_down"
    name: Enable

# esp32_camera_web_server:
