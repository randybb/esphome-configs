---
substitutions:
  device: nspanel-office-j
  name: Office J NSPanel
  area: Office J
  comment: NSPanel

esphome:
  name: mcu-${device}
  friendly_name: ${name}
  area: ${area}
  comment: ${comment}

packages:
  common: !include common/common.yaml
  nspanel: !include
    file: common/nspanel.yaml
    vars:
      temperature_entity: sensor.zigbee_office_j_temperature
      ntc_reference_temperature: 22°C
  sleep_dim: !include
    file: common/nspanel_sleep_dim.yaml
    vars:
      sleep_override_entity: light.office_j_lights

nspanel_lovelace:
  cards:
    - type: cardGrid
      title: Janko
      entities:
        - name: Svetlo
          entity_id: light.mcu_nspanel_office_j_light
          icon: wall-sconce-flat
        - name: Nočná lampa
          entity_id: light.bedside_left
          icon: lamp

    - type: cardGrid
      title: Brána
      entities:
        - name: Otvoriť
          entity_id: button.mcu_gate_open
          icon: gate-open
        - name: Zatvoriť
          entity_id: button.mcu_gate_close
          icon: gate
        - name: Automatizácia
          entity_id: navigate.card_gate_automation

    - type: cardThermo
      title: Kúrenie
      thermo_entity_id: climate.bt_trv_office_j

    - type: cardEntities
      title: Automatizácia
      id: card_gate_automation
      hidden: true
      entities:
        - name: Auto-otváranie
          entity_id: switch.gate_auto_open
        - name: Auto-zatváranie
          entity_id: switch.gate_auto_close

binary_sensor:
  - platform: gpio
    name: Left Button
    pin:
      number: 14
      inverted: true
    on_click:
      - light.toggle: light_1
      - lambda: 'id(nspanel_id).render_default_page();'

  - platform: gpio
    name: Right Button
    pin:
      number: 27
      inverted: true
    on_click:
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: light.bedside_left
      - lambda: 'id(nspanel_id).render_default_page();'

output:
  - id: relay_1
    platform: gpio
    pin:
      number: 22
  # - id: relay_2
  #   platform: gpio
  #   pin:
  #     number: 19

light:
  - platform: binary
    name: Light
    id: light_1
    output: relay_1
    restore_mode: RESTORE_DEFAULT_OFF
#   # - platform: binary
#   #   name: Relay 2
#   #   output: relay_2
