---
# Hardware: Seeed Studio XIAO ESP32-C5 (host, its own radio in 802.11p for ITS-G5)
#         + Seeed Studio XIAO ESP32-C6 (esp32_hosted co-processor, Wi-Fi uplink over SPI)
# Wi-Fi on the C6 needs esphome/esphome#22819 and hn/esphome-its-g5#3 (external components below)
# and the co-processor firmware from hosted/xiao-c6-spi on the C6.
# Pinout:
#   GPIO8   D8   -> esp32_hosted clk        -> C6 D8  GPIO19
#   GPIO9   D9   <- esp32_hosted miso       <- C6 D9  GPIO20
#   GPIO10  D10  -> esp32_hosted mosi       -> C6 D10 GPIO18
#   GPIO7   D3   -> esp32_hosted cs         -> C6 D3  GPIO21
#   GPIO1   D0   <- esp32_hosted handshake  <- C6 D0  GPIO0
#   GPIO0   D1   <- esp32_hosted data_ready <- C6 D1  GPIO1
#   GPIO25  D2   -> esp32_hosted reset      -> C6 D2  GPIO2 (CP firmware restarts itself on LOW)
#   GND, 3V3 shared
substitutions:
  device: its-g5
  name: ITS-G5
  area: DEV
  comment: ITS-G5 receiver
  # OpenTrafficMap node ID (MQTT topics its/<node_id>/...): the reference firmware uses the MAC as
  # lowercase hex; replace it if opentrafficmap assigned a name (e.g. "node789")
  node_id: "3844bebe8638"

esphome:
  name: mcu-${device}
  friendly_name: ${name}
  area: ${area}
  comment: ${comment}
  includes:
    - common/its_g5/decode.h  # its_g5_decode:: header decoding for the lambdas below

esp32:
  board: seeed_xiao_esp32c5
  framework:
    type: esp-idf

packages:
  common: !include common/common.yaml
  # ipv6_only off: eppp_link (pulled in by esp_wifi_remote) needs IPv4, fix belongs in esp-protocols
  # ipv6_only: !include common/ipv6_only.yaml

external_components:
  # Wi-Fi on the esp32_hosted co-processor of a host with its own radio
  - source: github://pr#22819
    components: [wifi]
  # its_g5_receiver allowing wifi on the co-processor
  - source: github://hn/esphome-its-g5@pull/3/head
    components: [its_g5_receiver]
    refresh: 1d

esp32_hosted:
  type: spi
  variant: ESP32C6
  clk_pin: GPIO8
  miso_pin: GPIO9
  mosi_pin: GPIO10
  cs_pin: GPIO7
  handshake_pin: GPIO1
  data_ready_pin: GPIO0
  reset_pin: GPIO25

wifi:
  use_coprocessor: true  # Wi-Fi on the C6, the C5 radio is for 802.11p
  # car: ESP joins the tablet's hotspot as a client
  min_auth_mode: WPA2
  networks:
    - id: !remove wifi_iot
    - ssid: !secret wifi_ssid_0
      password: !secret wifi_password_0

# Raw 802.11 frames as UDP broadcasts; in Wireshark use the "UDP Listener"
# (udpdump) interface on port 18511 with payload "wlan".
udp:
  id: its_udp

# Raw frames to the OpenTrafficMap C-ITS server, as in hn's its-g5-opentrafficmap.yaml
mqtt:
  id: mqtt_client
  broker: cits1.opentrafficmap.org
  port: 8883  # TLS is mandatory; publishing is anonymous
