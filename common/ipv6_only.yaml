---
# IPv6-only IoT network (SLAAC, no DHCPv4); add next to a common package:
#   packages:
#     common: !include common/common.yaml
#     ipv6_only: !include common/ipv6_only.yaml
external_components:
  # network enable_ipv4 (esphome/esphome#19750), drop once merged
  - source: github://pr#19750
    components: [const, network, wifi]

wifi:
  networks:
    - id: !extend wifi_iot
      ssid: !secret wifi_ssid_ipv6
      password: !secret wifi_password_ipv6

network:
  enable_ipv6: true
  enable_ipv4: false
  min_ipv6_addr_count: 1
