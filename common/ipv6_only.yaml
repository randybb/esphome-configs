---
# IPv6-only IoT network (SLAAC, no DHCPv4); add next to a common package:
#   packages:
#     common: !include common/common.yaml
#     ipv6_only: !include common/ipv6_only.yaml
external_components:
  # network enable_ipv4 (esphome/esphome#19750), drop once merged
  - source: github://pr#19750
    components: [const, network, wifi]
  # audio HTTP reader over IPv6 (dual-stack hosts resolve A first), drop once in #19750
  - source: github://randybb/esphome-components
    components: [audio]
    refresh: 1d

wifi:
  networks:
    - id: !extend wifi_iot
      ssid: !secret wifi_ssid_ipv6
      password: !secret wifi_password_ipv6

esp32:
  framework:
    components:
      # mdns 1.12.0 + fix for "A 0.0.0.0" without IPv4 (espressif/esp-protocols PR pending), drop once released
      - name: espressif/mdns
        source: https://github.com/randybb/esp-protocols.git
        ref: mdns-v1.12.0-zero-ipv4-test
        path: components/mdns

network:
  enable_ipv6: true
  enable_ipv4: false
  min_ipv6_addr_count: 1
