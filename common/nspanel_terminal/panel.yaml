---
# Sonoff NSPanel (EU) with the nspanel-terminal TFT: ESPHome draws the UI with LVGL.
# Shared part: display, touch, fonts, home page (clock, weather, temperatures), light detail, status/boot page,
# notifications, OTA progress, buzzer, screen power and the NTC sensor.
# The device file adds its grid pages (grid_page.yaml), tiles (*_tile.yaml), buttons and relays:
#   substitutions:
#     brightness: "80"
#     dim_brightness: "20"         # backlight after 15 s idle (sleep_dim.yaml lowers it at night)
#   packages:
#     panel: !include
#       file: common/nspanel_terminal/panel.yaml
#       vars:
#         temperature_entity: sensor.zigbee_office_r_temperature   # "dnu" on the home page
#         first_page: page_office  # tap on the home page
#         last_page: page_gate     # left arrow of the status page
defaults:
  ntc_reference_temperature: 25°C
  temperature_name: Temperature

esphome:
  includes:
    - common/nspanel_terminal/weather.h
    - common/nspanel_terminal/ha.h
    - common/nspanel_terminal/light.h
    - common/nspanel_terminal/thermostat.h
  on_boot:
    - priority: -100
      then:
        - lvgl.page.show: page_status

esp32:
  variant: esp32
  toolchain: esp-idf
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic
      minimum_chip_revision: 3.0
      sram1_as_iram: true
    sdkconfig_options:
      # NSPanel PSRAM on non-default pins
      CONFIG_D0WD_PSRAM_CLK_IO: "5"
      CONFIG_D0WD_PSRAM_CS_IO: "18"

psram:
  mode: quad
  speed: 40MHz
  ignore_not_found: false

external_components:
  - source: github://ptaru/nspanel-terminal@19fcafc0b30d4d2f75a7a170a963e6f08a13e3d9  # 0.5.0, untagged
    components: [nspanel_terminal]

wifi:
  power_save_mode: none

# Flashing shows on the status page. The OTA blocks the main loop, so each step renders the screen itself
ota:
  - id: !extend ota_esphome
    on_begin:
      - lvgl.page.show: page_status
      - lambda: |-
          lv_obj_set_hidden(id(status_ota), false);
          lv_obj_set_style_text_color(id(status_ota), lv_color_hex(0xFFB300), LV_PART_MAIN);
          lv_label_set_text(id(status_ota), "Flashovanie: začína...");
          lv_refr_now(nullptr);
    on_progress:
      - lambda: |-
          lv_label_set_text_fmt(id(status_ota), "Flashovanie: %.0f %%", x);
          lv_refr_now(nullptr);
    on_end:
      - lambda: |-
          lv_obj_set_style_text_color(id(status_ota), lv_color_hex(0x4DD966), LV_PART_MAIN);
          lv_label_set_text(id(status_ota), "Flashovanie: hotovo, reštartujem");
          lv_refr_now(nullptr);
    on_error:
      - lambda: |-
          lv_obj_set_style_text_color(id(status_ota), lv_color_hex(0xFF453A), LV_PART_MAIN);
          lv_label_set_text_fmt(id(status_ota), "Flashovanie: chyba %u", x);
          lv_refr_now(nullptr);

api:
  # status page until Home Assistant connects (log viewers don't subscribe to states)
  on_client_connected:
    - delay: 2s
    - if:
        condition:
          api.connected:
            state_subscription_only: true
        then:
          - lvgl.page.show: page_home
  on_client_disconnected:
    - if:
        condition:
          not:
            api.connected:
              state_subscription_only: true
        then:
          - lvgl.page.show: page_status
  actions:
    # same signatures as on the lovelace panels, so the HA automations keep working
    - action: notify
      variables:
        heading: string
        message: string
        song: string
      then:
        - script.execute:
            id: notify_show
            heading: !lambda return heading;
            message: !lambda return message;
            timeout_ms: 10000
        - if:
            condition:
              lambda: return !song.empty();
            then:
              - rtttl.play:
                  rtttl: !lambda 'return song;'
    # buttons and icon were never implemented on the lovelace panels either
    - action: notify_fullscreen
      variables:
        title: string
        description: string
        button1: string
        button2: string
        timeout: int
        icon: string
      then:
        - script.execute:
            id: notify_show
            heading: !lambda return title;
            message: !lambda return description;
            timeout_ms: !lambda return timeout;
        - rtttl.play: "scale_up:d=32,o=5,b=100:c,c#,d#,e,f#,g#,a#,b"
    - action: show_info
      then:
        - script.execute: info_popup
    # https://github.com/granadaxronos/120-SONG_NOKIA_RTTTL_RINGTONE_PLAYER_FOR_ARDUINO_UNO/blob/master/RTTTL_PLAYER/songs.h
    - action: play_rtttl
      variables:
        song: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song;'

    - action: set_brightness
      variables:
        percent: int
      then:
        - lambda: 'id(panel).request_brightness(percent);'
    # url empty = tft_url from secrets (terminal), rollback: http://ha.local/local/tft/lui.tft
    - action: upload_tft
      variables:
        url: string
      then:
        - lambda: |-
            if (!url.empty()) id(panel).set_tft_url(url);
            id(panel).request_tft_upload();

uart:
  id: display_uart
  tx_pin: 16
  rx_pin: 17
  baud_rate: 115200
  rx_buffer_size: 4096

display:
  - platform: nspanel_terminal
    id: panel
    uart_id: display_uart
    width: 454
    height: 320
    update_interval: never
    auto_clear_enabled: false
    tft_url: !secret tft_url_terminal
    brightness: ${brightness}

touchscreen:
  - platform: nspanel_terminal
    id: panel_touch
    display: panel
    panel_id: panel
    calibration:
      x_min: 0
      x_max: 453
      y_min: 0
      y_max: 319
    on_touch:
      - if:
          condition:
            lambda: return id(dimmed);
          then:
            - globals.set:
                id: dimmed
                value: "false"
            - lambda: 'id(panel).request_brightness(${brightness});'

globals:
  - id: dimmed
    type: bool
    initial_value: "false"
  # light shown on page_light and the index of the page to return to
  - id: cur_light
    type: std::string
  - id: back_page
    type: size_t
  # brightness the on_idle dim goes to (sleep_dim.yaml lowers it at night)
  - id: idle_brightness
    type: int
    initial_value: ${dim_brightness}

