---
# IPv6-only IoT network (SLAAC, no DHCPv4) for ethernet devices; add next to a common package:
#   packages:
#     common_eth: !include common/common_eth.yaml
#     ipv6_only: !include common/ipv6_only_eth.yaml
# WiFi devices use common/ipv6_only.yaml (this + the IPv6 SSID)
external_components:
  # network enable_ipv4 + audio HTTP reader over IPv6 (esphome/esphome#19750), drop once merged
  - source: github://pr#19750
    components: [const, network, wifi, ethernet, audio]
    refresh: 1h

esp32:
  framework:
    components:
      # mdns 1.14.0: no "A 0.0.0.0" without IPv4 + IPv6 on ETH-only builds (espressif/esp-protocols#1156, #1161),
      # drop once on ESPHome 2026.10.0 (esphome/esphome#20383 bumps the pin from 1.12.0)
      - name: espressif/mdns
        ref: 1.14.0
      # IDF v5.5.5 lwip + .local resolution over IPv6 (espressif/esp-lwip#94), drop once in IDF
      - name: lwip
        source: https://github.com/randybb/esp-lwip.git
        ref: idf-v5.5.5-lwip-component
        path: lwip

network:
  enable_ipv6: true
  enable_ipv4: false
  min_ipv6_addr_count: 1
