# Hardware: Linux host (ESPHome host platform)
# Pinout:
#   /dev/ttyACM3  nRF52840 DK running ant_bridge (J-Link VCOM, usb-SEGGER_J-Link_000683492497)
substitutions:
  device: ant-host
  name: ANT+ Host
  comment: ANT+ heart rate monitor via nRF52840 DK bridge

esphome:
  name: mcu-${device}
  friendly_name: ${name}
  comment: ${comment}

host:

packages:
  api: !include common/api.yaml
  logger: !include common/logger.yaml

external_components:
  - source: github://randybb/esphome-components
    components: [ant_plus]

uart:
  # the host uart only takes /dev/<name>, not /dev/serial/by-id/...
  port: /dev/ttyACM3
  baud_rate: 115200

ant_plus:
  device_number: 655730
  heart_rate:
    name: Heart Rate
    filters:
      - throttle: 1s
