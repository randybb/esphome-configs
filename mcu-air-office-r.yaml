---
# Hardware: IKEA VINDRIKTNING (modded) + M5Stack M5Stamp Pico
# Pinout:
#   GPIO21  PM1006 UART                -> particle_uart (uart tx_pin)
#   GPIO22  PM1006 UART                -> particle_uart (uart rx_pin)
#   GPIO25  TZT 8-bit WS2812 5050 stick (8 LEDs, 7 visible outside; LEDs 1-7 broken), disabled
#   GPIO27  Onboard RGB LED (1x WS2812, inside), unused
#   GPIO32  Grove SDA                  -> i2c (i2c sda)
#   GPIO33  Grove SCL                  -> i2c (i2c scl)
substitutions:
  device: air-office-r
  name: Office R Air
  name_short: Office R
  area: Office R
  comment: AirQ Monitoring

esphome:
  name: mcu-${device}
  friendly_name: ${name}
  area: ${area}
  comment: ${comment}

esp32:
  variant: esp32
  toolchain: esp-idf
  framework:
    type: esp-idf

packages:
  common: !include common/common.yaml

i2c:
  # - id: i2c0
  sda: 32
  scl: 33
  scan: true #false
  frequency: 100kHz
  # - id: i2c1
  # sda: 25
  # scl: 22
  # scan: true #false

uart:
  id: particle_uart
  tx_pin: 21
  rx_pin: 22
  baud_rate: 9600

