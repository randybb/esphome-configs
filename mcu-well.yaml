valve:
  - platform: template
    name: "Irrigation Valve A1"
    lambda: |-
      if (id(irrigation_relay_1).state) {
        return VALVE_OPEN;
      } else {
        return VALVE_CLOSED;
      }
    open_action:
      - switch.turn_on: irrigation_relay_1
    close_action:
